buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        google()
    }
}

allprojects {
    apply plugin: 'eclipse'
    version = '1.0.0'
    ext {
        appName = 'CaveRunner'
        gdxVersion = '1.13.1'
    }
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}

project(':core') {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_17
    }
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
    }
}
